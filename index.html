<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet Care Planner</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f1f7f4; color: #17332c; font: 16px system-ui, sans-serif; }
main { max-width: 1060px; margin: 40px auto; padding: 0 20px; }
h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); }
h2 { margin-top: 0; }
header { padding-bottom: 12px; }
section { background: white; border: 1px solid #cadfd4; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 260px),1fr)); gap: 16px; }
label { display: grid; gap: 5px; font-weight: 600; }
input, select, button, .button { font: inherit; border-radius: 7px; padding: 8px 10px; }
input, select { width: 100%; border: 1px solid #7b9c8c; background: white; color: inherit; }
button, .button { background: #185541; color: white; border: 1px solid #185541; cursor: pointer; text-decoration: none; display: inline-block; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
form.actions { display: inline-flex; }
a { color: #185541; }
.error { color: #8e1e22; }
.plan { padding: 12px 0; border-top: 1px solid #cadfd4; }
.plan p { margin: 5px 0 8px; }
</style>
</head>
<body><main>
<header><h1>Pet Care Planner</h1><p>Schedule procedures and keep track of upcoming care.</p></header>
@@ERROR@@
<div class="grid"><section><h2>@@TITLE@@</h2>
<form method="post" action="/save"><input type="hidden" name="id" value="@@ID@@">
<p><label>Pet name<input name="pet" required maxlength="60" value="@@PET@@"></label></p>
<p><label>Procedure<select name="procedure" required>@@PROCEDURES@@</select></label></p>
<p><label>Extra service<select name="service">@@SERVICES@@</select></label></p>
<p><label>Requested date<input type="date" name="date" required min="2000-01-01" max="2099-12-31" value="@@DATE@@"></label></p>
<p><label>Scheduling method<select name="strategy">@@STRATEGIES@@</select></label></p>
<div class="actions"><button>Save plan</button>@@CANCEL@@</div></form></section>
<section><h2>Reminders</h2><p>Pending care due tomorrow, today, or overdue.</p>
<ul>@@REMINDERS@@</ul></section></div>
<section><h2>Saved plans</h2><p><a class="button" href="/summary">Download care summary</a></p>
@@PLANS@@</section></main></body></html>
